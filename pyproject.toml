[project]
name = "pollinodigitaltwin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "black>=26.5.1",
    "httpx>=0.28.1",
    "hypothesis>=6.155.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "playwright>=1.60.0",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.15",
    "sqlalchemy>=2.0.50",
    "tenacity>=9.1.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W"]
