services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pollino
      POSTGRES_PASSWORD: pollino_dev
      POSTGRES_DB: pollino
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollino -d pollino"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
